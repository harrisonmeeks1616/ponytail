<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17202a">
<title>Electrical PM Mastery</title>
<meta name="description" content="A 365-day plan to reach master-level electrical contracting project management, with daily tasks, spaced-repetition drills, field calculators, and a skills radar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a panelboard schedule. The year is a 365-circuit panel; every tab is a page of the panel binder. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #e4e9ee; --ink: #17202a; --muted: #55636f; --line: #cdd5dd;
  --accent: #a4502a; --accent-ink: #ffffff; --accent-soft: #f3e2d8;
  --p1: #7a4b2a; --p2: #b0560c; --p3: #8c6900; --p4: #2d68ad; --p5: #2e8549;
  --good: #2e7d46; --warn: #9a6400; --bad: #b3261e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --surface: #171e24; --sunk: #1f2830; --ink: #e3e8ed; --muted: #95a3ae; --line: #2c3742;
    --accent: #e3895a; --accent-ink: #1b0f08; --accent-soft: #3b271c;
    --p1: #bb8a63; --p2: #f0903f; --p3: #e0b93a; --p4: #6ba3e6; --p5: #5bbb7b;
    --good: #5bbb7b; --warn: #e0b93a; --bad: #f2776c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --surface: #171e24; --sunk: #1f2830; --ink: #e3e8ed; --muted: #95a3ae; --line: #2c3742;
  --accent: #e3895a; --accent-ink: #1b0f08; --accent-soft: #3b271c;
  --p1: #bb8a63; --p2: #f0903f; --p3: #e0b93a; --p4: #6ba3e6; --p5: #5bbb7b;
  --good: #5bbb7b; --warn: #e0b93a; --bad: #f2776c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 1.9rem; }
h3 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
p { margin: 0; }
.app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 56px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 6px 12px; }
.brand h1 { font-size: 2rem; text-transform: uppercase; letter-spacing: .03em; font-weight: 700; }
.brand p { font-family: var(--mono); font-size: .78rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: .82rem; white-space: nowrap; }
.chip b { font-family: var(--mono); font-weight: 500; }
.chip.good { border-color: var(--good); color: var(--good); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.chip.bad { border-color: var(--bad); color: var(--bad); }
.dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: .82rem; }
.iconbtn:hover { border-color: var(--accent); }

/* Tabs */
.tabs-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 8px; cursor: pointer; font-family: var(--display); font-size: 1.05rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

/* Generic surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.done { background: var(--good); border-color: var(--good); color: var(--surface); }
.btn:disabled { opacity: .55; cursor: default; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.label { font-family: var(--mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.banner { border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }

/* Today */
.today { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.dayhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.task { font-size: 1.16rem; line-height: 1.6; max-width: 65ch; margin-block: 14px 6px; }
.goal { color: var(--muted); max-width: 65ch; margin-top: 6px; }
.section { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.res { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.res li { display: flex; flex-direction: column; gap: 2px; }
.res .why { color: var(--muted); font-size: .88rem; }
.qa { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--bg); }
.qa p { max-width: 65ch; }
.qa .ans { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: .88rem; margin-top: 6px; }
textarea, input[type="text"], input[type="number"], input[type="date"], select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 10px; }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.actions .spacer { flex: 1; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.slot { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 6px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.slot .k { font-family: var(--mono); font-size: .62rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.slot .n { font-family: var(--mono); font-size: .8rem; }
.slot.is-done { background: var(--ph); border-color: var(--ph); }
.slot.is-done .k, .slot.is-done .n { color: var(--surface); }
.slot.is-sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.meter { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ph, var(--accent)); }
.coach-out { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-height: 3rem; max-height: 420px; overflow-y: auto; font-size: .93rem; }

/* Panel schedule */
.phase { margin-bottom: 26px; }
.phase-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; margin-bottom: 10px; }
.phase-head h2 { display: flex; align-items: center; gap: 10px; }
.phase-head .meter { width: 180px; }
.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 8px; }
.wk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.wk-top { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.wk-top .mono { color: var(--muted); font-size: .78rem; flex: none; }
.wk-top span:last-child { font-weight: 500; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.breakers { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.brk { height: 30px; border-radius: 3px; border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: .7rem; color: var(--muted); cursor: pointer; padding: 0; }
.brk.is-done { background: var(--ph); border-color: var(--ph); color: var(--surface); }
.brk.is-today { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; font-size: .88rem; }

/* Drill */
.drill { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.flash { min-height: 220px; display: flex; flex-direction: column; gap: 14px; }
.flash .q { font-size: 1.2rem; line-height: 1.5; }
.boxes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; text-align: center; }
.box .num { font-size: 1.3rem; }

/* Toolkit */
.tool { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.toollist { display: flex; flex-direction: column; gap: 4px; }
.toollist button { text-align: left; background: none; border: 1px solid transparent; border-radius: var(--r); padding: 8px 10px; cursor: pointer; }
.toollist button[aria-pressed="true"] { background: var(--surface); border-color: var(--line); font-weight: 600; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: .84rem; color: var(--muted); }
.out { display: flex; flex-direction: column; margin-top: 16px; border-top: 1px solid var(--line); }
.out > div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.out .v { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.out .v.good { color: var(--good); } .out .v.warn { color: var(--warn); } .out .v.bad { color: var(--bad); }
.note { margin-top: 12px; font-size: .88rem; color: var(--muted); max-width: 70ch; }
.tablewrap { overflow-x: auto; margin-top: 14px; }
table { border-collapse: collapse; font-size: .88rem; min-width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.num, th.num { text-align: right; }

/* Skills */
.skills { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; align-items: start; }
.radar { width: 100%; max-width: 460px; height: auto; display: block; margin: 0 auto; }
.skill { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.seg { align-self: flex-start; display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-family: var(--mono); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Path */
.ladder { display: flex; flex-direction: column; gap: 0; }
.rung { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.rung .yrs { font-family: var(--mono); color: var(--muted); font-size: .85rem; }
.rung dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; margin: 8px 0 0; font-size: .92rem; }
.rung dt { color: var(--muted); }
.rung dd { margin: 0; }
.levers { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.lever h4 { margin: 0 0 6px; font-family: var(--display); font-size: 1.15rem; font-weight: 600; }

/* Library */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .85rem; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.lib .card { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.mq { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.mq li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; font-size: .93rem; }

/* Settings overlay */
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 18, .55); z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 10px; border: 1px solid var(--line); width: 100%; max-width: 560px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: .88rem; z-index: 30; }

@media (max-width: 860px) {
  .today, .skills, .tool { grid-template-columns: minmax(0, 1fr); }
  .tabs, .toollist { flex-direction: row; flex-wrap: wrap; } /* every tab and calculator visible on a phone, no hidden scroll */
  .tab { padding: 8px 10px 6px; }
  .toollist button { border-color: var(--line); padding: 5px 10px; font-size: .88rem; }
  .rung, .rung dl { grid-template-columns: minmax(0, 1fr); }
  h2 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .slot, .brk, .btn, .tab { transition: background-color .15s, border-color .15s, color .15s; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Electrical PM Mastery</h1>
      <p>365-circuit panel &middot; commercial electrical project management</p>
    </div>
    <div class="chips" id="status"></div>
  </header>

  <div class="tabs-wrap">
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  </div>

  <main>
    <section data-view="today" id="v-today"></section>
    <section data-view="panel" id="v-panel" hidden></section>
    <section data-view="drill" id="v-drill" hidden></section>
    <section data-view="toolkit" id="v-toolkit" hidden></section>
    <section data-view="skills" id="v-skills" hidden></section>
    <section data-view="path" id="v-path" hidden></section>
    <section data-view="library" id="v-library" hidden></section>
  </main>
</div>
<div class="overlay" id="settings" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="plan.js"></script>
<script>
(() => {
  'use strict';
  const E = window.EPM;
  if (!E) { document.querySelector('main').textContent = 'Could not load plan.js. Check your connection and reload.'; return; }
  const DAYS = E.buildDays();
  const CARDS = E.buildCards();
  const PH = Object.fromEntries(E.PHASES.map(p => [p.id, p]));
  const PHVAR = id => `var(--p${id})`;
  const $ = s => document.querySelector(s);

  // Tiny DOM builder. Strings become text nodes, never HTML.
  function h(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), e => {
        v(e);
        // A re-render replaced the control that had focus: move focus to its replacement (keyboard and screen readers).
        const id = props['data-focus'] || n.id;
        if (id && !n.isConnected) { const t = document.getElementById(id); if (t) t.focus({ preventScroll: true }); }
      });
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
    return n;
  }
  const svg = (tag, attrs) => { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v); return n; };

  const pad = n => String(n).padStart(2, '0');
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const dow = iso => new Date(iso + 'T00:00:00Z').getUTCDay();
  const nextMonday = iso => E.addDays(iso, (8 - dow(iso)) % 7);
  const fmtDate = (iso, opts = { weekday: 'short', month: 'short', day: 'numeric' }) => new Date(iso + 'T00:00:00Z').toLocaleDateString(undefined, { ...opts, timeZone: 'UTC' });
  const money = v => (v < 0 ? '(' : '') + '$' + Math.abs(v).toLocaleString(undefined, { maximumFractionDigits: 0 }) + (v < 0 ? ')' : '');
  const num = (v, d = 0) => v == null || !isFinite(v) ? 'n/a' : v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  const pctf = (v, d = 1) => v == null || !isFinite(v) ? 'n/a' : (v * 100).toFixed(d) + '%';
  const ckt = n => 'CKT ' + String(n).padStart(3, '0');

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 1800);
  }

  // ---------------- State and storage ----------------
  const KEY = 'epm-state-v1';
  const blank = () => ({ v: 1, start: nextMonday(todayISO()), done: {}, notes: {}, skills: { base: {}, now: {} }, cards: {}, updated: 0 });
  function normalize(o) {
    const s = Object.assign(blank(), o && typeof o === 'object' ? o : {});
    for (const k of ['done', 'notes', 'cards']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
    if (!s.skills || typeof s.skills !== 'object') s.skills = {};
    for (const k of ['base', 'now']) if (!s.skills[k] || typeof s.skills[k] !== 'object') s.skills[k] = {};
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s.start)) s.start = blank().start;
    return s;
  }
  let S = blank();
  try { const raw = localStorage.getItem(KEY); if (raw) S = normalize(JSON.parse(raw)); } catch (e) { /* storage blocked: run in memory */ }

  const cloud = { ref: null, writing: false, queued: false, timer: 0, retry: 0, status: 'local' };
  let localOk = true;
  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); localOk = true; }
    catch (e) { if (localOk) toast("This browser wouldn't save your progress. Open Settings and copy a backup."); localOk = false; renderStatus(); }
  }
  const clone = o => JSON.parse(JSON.stringify(o));
  const typing = () => /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  // Fold another copy of this progress (the cloud copy, another tab) into this one; true if anything here changed.
  function absorb(other) {
    const merged = normalize(E.mergeProgress(normalize(clone(other)), S));
    if (E.canon(merged) === E.canon(S)) return false;
    const atToday = ui.sel === calDay();
    S = merged;
    if (atToday) ui.sel = calDay();
    saveLocal();
    if (typing()) renderStatus(); else renderAll(); // never rebuild a note mid-sentence
    return true;
  }
  function save() {
    S.updated = Date.now();
    saveLocal();
    if (cloud.ref) { clearTimeout(cloud.timer); cloud.timer = setTimeout(() => { cloud.timer = 0; pushCloud(); }, 1200); }
  }
  async function pushCloud() {
    if (!cloud.ref) return;
    if (cloud.writing) { cloud.queued = true; return; }
    const body = JSON.stringify(S);
    // ponytail: one cloud doc per learner caps at 256 KiB (about a year of long daily notes). Split notes into per-phase docs if anyone gets there.
    if (new Blob([body]).size > 250000) return setSync('full');
    cloud.writing = true;
    try { await cloud.ref.set(JSON.parse(body)); cloud.retry = 0; setSync('cloud'); }

    o.append(h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Settings' },
      h('div', { class: 'row', style: 'justify-content:space-between' }, h('h2', null, 'Settings'), h('button', { class: 'btn', onclick: closeSettings }, 'Close')),
      h('div', { class: 'field' }, h('label', { for: 'set-start' }, 'Program start date (Day 1). A Monday keeps Deep Work on Saturdays.'), start),
      h('p', { id: 'set-sync', class: 'small muted' }, SYNC_TEXT[cloud.status]),
      h('div', { class: 'field' }, h('label', { for: 'set-export' }, 'Backup (copy and keep somewhere safe)'), exp,
        h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => {
          exp.value = JSON.stringify(S); // the latest, not the copy from when Settings opened
          navigator.clipboard.writeText(exp.value).then(() => { msg.textContent = 'Backup copied.'; }, () => { exp.select(); msg.textContent = 'Copy blocked here. The text is selected; copy it manually.'; });
        } }, 'Copy backup'))),
      h('div', { class: 'field' }, h('label', { for: 'set-import' }, 'Restore from backup'), imp,
        ui.pendingRestore
          ? h('div', { class: 'stack' },
            h('p', { class: 'small' }, `Replace ${Object.keys(S.done).length} done days and ${Object.keys(S.notes).length} notes (here and in your synced copy) with ${Object.keys(ui.pendingRestore.done).length} done days and ${Object.keys(ui.pendingRestore.notes || {}).length} notes from this backup?`),
            h('div', { class: 'row' },
              h('button', { class: 'btn', style: 'border-color:var(--bad);color:var(--bad)', onclick: () => { replaceAll(ui.pendingRestore); ui.pendingRestore = null; renderSettings(); toast('Backup restored'); } }, 'Replace with backup'),
              h('button', { class: 'btn', onclick: () => { ui.pendingRestore = null; renderSettings(); } }, 'Cancel')))
          : h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => {
            try { const o2 = JSON.parse(imp.value); if (!o2 || o2.v !== 1 || !o2.done || typeof o2.done !== 'object') throw new Error('shape'); ui.pendingRestore = o2; renderSettings(); }
            catch (e) { msg.textContent = 'That is not a valid backup from this app. Paste the full text from "Backup".'; }
          } }, 'Restore'))),
      msg,
      h('div', { class: 'section' },
        ui.confirmReset
          ? h('div', { class: 'stack' }, h('p', { class: 'small' }, 'This erases done days, notes, skill ratings, and drill history here and in your synced copy. It cannot be undone.'),
            h('div', { class: 'row' }, h('button', { class: 'btn', style: 'border-color:var(--bad);color:var(--bad)', onclick: () => { replaceAll(blank()); ui.confirmReset = false; renderSettings(); toast('Progress erased'); } }, 'Erase everything'),
              h('button', { class: 'btn', onclick: () => { ui.confirmReset = false; renderSettings(); } }, 'Cancel')))
          : h('button', { class: 'btn', onclick: () => { ui.confirmReset = true; renderSettings(); } }, 'Reset progress...'))));
  }
  $('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });

  // ---------------- Boot ----------------
  function renderAll() { renderStatus(); renderTabs(); render[ui.tab](); }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#settings').hidden) return closeSettings();
    if (ui.tab !== 'today' || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName)) return;
    if (e.key === 'ArrowLeft') openDay(ui.sel - 1);
    if (e.key === 'ArrowRight') openDay(ui.sel + 1);
  });

  // Another tab saved: merge its progress instead of overwriting it with this tab's older copy on the next click.
  addEventListener('storage', e => { if (e.key === KEY && e.newValue) try { absorb(JSON.parse(e.newValue)); } catch (err) { /* not ours */ } });
  addEventListener('online', () => { if (cloud.ref && cloud.status === 'error') pushCloud(); });
  // A tab left open overnight moves to the new day instead of showing yesterday as Today.
  let shownDay = todayISO();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || todayISO() === shownDay) return;
    const was = shownDay < S.start ? 1 : E.dayNumber(S.start, shownDay);
    shownDay = todayISO();
    if (ui.sel === was) ui.sel = calDay();
    renderAll();
  });

  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ tab: ui.tab, sel: ui.sel, calc: ui.calc })); } catch (e) { /* optional */ }
  function start(data) {
    const tab = (location.hash || '').slice(1);
    ui.sel = (data && data.sel) || calDay();
    ui.calc = (data && data.calc) || ui.calc;
    ui.tab = (data && data.tab) || (TABS.some(t => t[0] === tab) ? tab : 'today');
    go(ui.tab);
    renderStatus();
    connectCloud();
    connectCoach();
  }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
