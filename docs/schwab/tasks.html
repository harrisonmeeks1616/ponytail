<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAFAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="H.A. Sack-Electrical">
<title>H.A. Sack-Electrical · Sack Company-Electrical</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="top"><div class="top-in">
  <svg class="mark" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><rect width="24" height="24" rx="6.5"/><path d="M13.6 3.5 6.5 13.4h4.6l-1.2 7.1 7.6-10.4h-4.7z"/></svg>
  <div class="brand"><h1>H.A. Sack-Electrical</h1><p>Sack Company-Electrical</p></div>
  <span id="hubDot"></span>
  <button class="icon-btn lang" id="langBtn" data-act="toggleLang" aria-label="Español">ES</button>
  <button class="icon-btn" id="gearBtn" data-go="settings" hidden></button>
  <button class="icon-btn" id="lockBtn" data-act="lockBtn" aria-label="Office sign-in"></button>
</div></header>
<main>
  <div class="screen-head" id="head"><span id="headBack"></span><p class="proj" id="proj"></p>
    <div class="title-row"><h2 class="large-title" id="title"></h2><span id="titleMore"></span></div><p class="subtitle" id="subtitle"></p></div>
  <div id="app"></div>
  <div class="bar" id="bar"></div>
</main>
<nav class="tabbar" id="officeTabs" aria-label="Screens"></nav>
<script>setTimeout(() => { const app = document.getElementById('app'); if (window.appStarted) return; let es = false; try { es = JSON.parse(localStorage.getItem('schwab.settings')).lang === 'es'; } catch {} app.innerHTML = es ? '<div class="empty"><h2>La app no termin\u00f3 de cargar</h2><p>Con se\u00f1al, vuelva a cargar.</p><button class="btn primary" onclick="location.reload()">Recargar</button></div>' : '<div class="empty"><h2>The app didn\u2019t finish loading</h2><p>Get signal, then reload. · La app no termin\u00f3 de cargar. Con se\u00f1al, vuelva a cargar.</p><button class="btn primary" onclick="location.reload()">Reload · Recargar</button></div>'; }, 6000); // a dropped file on the first open after an update; a Spanish phone gets Spanish only</script>
<script type="module">
import {
  KEYS, esc, uid, load, save, loadSettings, nameKey, cleanName, people, findPerson, crewById, addPerson, normTask, newItem, mergeTask, cloneTask, pack, unpack, linkTo,
  nextId, renumberClashes, sameNumber, ensureDevice,
  today, addDays, niceDate, nowHM, span, fmtMin, t12, stamp, hrs, timeOf, field, datalist, seg, setPath, getPath, readInput, dateBar,
  toast, sheet, ask, sendSheet, pasteSheet, makePdf, savePdf, fileAway, retryUploads, settingsView, settingsAct, restore,
  registerSW, crewVar as cv, L, setLang, getLang, COMPANY, COMPANY_ALT, COMPANIES, letterhead, icon, screenHead, busy,
  UNLOCK, PIN_FORMAT, hasPin, adoptPin, setPin, pinHash, tryPin, unlocked, signIn, signOut, onSave,
} from './shared.mjs';
import { renderOffice, reportAct, reportInput, openReport, openHours, hoursInput, workerChange, fileReportIfChanged, reloadReports, sectionToggle, hasReports, attachShifts,
  reportsNow, crewNow, dropReport, setTextField } from './report.mjs';
import * as sync from './sync.mjs';
import { liveView, recordsView, hubSettingsView, statusDot, joinSheet, txView, txField, after as liveAfter, owns as liveOwns, act as liveAct, onInput as liveInput, deleteRecord } from './live.mjs';

window.appStarted = true; // every file loaded (see the fallback above)
registerSW();
const app = document.getElementById('app'), bar = document.getElementById('bar');
const S = loadSettings(); // one object for the life of the page: reloads copy into it, so report.mjs, live.mjs and the hub sync share it
setLang(S.lang);
ensureDevice(); // this phone's hub identity; the time clock uses the older device id until it exists
attachShifts(S);
const loadTasks = () => load(KEYS.tasks, []).map(normTask).filter(t => t.uid); // a sheet with no usable id can't be opened or told apart
let T = loadTasks();
let day = today(), crewFilter = '', view = { v: 'board' };

const persist = () => save(KEYS.tasks, T) || toast(L("This phone wouldn't save. Open Settings and download a backup."), 'bad');
const find = u => T.find(t => t.uid === u);
const current = () => (view.v === 'task' ? find(view.uid) : null);
const go = h => (location.hash === '#' + h ? route() : (location.hash = h));
const crewVar = (name, id) => cv(S, name, id);
const floorRank = f => { const i = S.floors.indexOf(f); return i < 0 ? 999 : i; };
const doneCount = t => t.items.filter(i => i.done).length;
const worked = t => (t.aStart && t.aStop ? Math.max(0, span(t.aStart, t.aStop) - t.delay) : 0); // same as shared.mjs; kept here so a stale cached shared.mjs can't break this page
const isOpen = t => t.status !== 'Complete' && t.review !== 'Accepted';
// Signed out, this is a crew phone: only the sheets sent to it show. The office passcode opens the rest.
const office = () => unlocked();
// The hub (HUB.md): hubOn, this phone is connected; role, its office role for the hub screens (the hub's word when it has
// one, else Settings), 'crew' when signed out.
const hubOn = () => sync.hubStatus().state !== 'off';
const role = () => (!office() ? 'crew' : ['pm', 'super'].includes(S.hubRole) ? S.hubRole : isPM() ? 'pm' : 'super');
const visible = () => (office() ? T : T.filter(t => t.origin === 'link'));
const prevDay = () => [...new Set(visible().map(t => t.date))].filter(d => d < day).sort().at(-1);
const dayTasks = () => visible().filter(t => t.date === day);
const fromTo = (a, b) => L('{start} to {stop}', { start: t12(a), stop: t12(b) });

function stage(t) {
  if (t.review === 'Accepted') return [L('Accepted'), 'good'];
  if (t.review) return [L('Follow-up'), 'warn'];
  if (t.status) return [L(t.status), { Complete: 'good', Partial: 'warn', Blocked: 'bad' }[t.status]];
  if (t.aStart) return [L('Working'), 'info'];
  if (t.origin === 'link') return [L('To do'), '']; // the crew's side: "Sent" would read as their own results sent
  if (t.sentAt) return [L('Sent'), 'info'];
  return [L('Draft'), ''];
}

// Picking a crew puts its people on the sheet, by id; names typed before a crew was picked stay, and join it.
function pickCrew(t, c) {
  if (!c) return;
  if (t.crewId ? t.crewId === c.id : t.crew === c.name) { t.crewId = c.id; return; } // the same crew again (a sheet from before ids learns its id)
  const typed = t.crew ? [] : t.members.filter((m, i) => !t.memberIds[i] && !findPerson(S, m));
  const ps = people(S).filter(p => p.crewId === c.id);
  Object.assign(t, { crew: c.name, crewId: c.id, lead: c.lead, members: [...ps.map(p => p.name), ...typed], memberIds: [...ps.map(p => p.id), ...typed.map(() => '')] });
  t.size = t.members.length || t.size;
  enlist(t);
}

// Every name on the sheet without an id is matched to the roster (preferring the sheet's crew); a name that matches
// no one joins the sheet's crew in Settings as a new person: one list of people for the sheets, the time clock and
// the crew hours. Nobody is taken off a crew from here.
function enlist(t) {
  const added = [];
  t.memberIds = t.members.map((m, i) => {
    if (t.memberIds[i]) return t.memberIds[i];
    let p = findPerson(S, m, t.crewId);
    if (!p && crewById(S, t.crewId) && (p = addPerson(S, m, t.crewId))) added.push(p.name);
    return p?.id || '';
  });
  if (!added.length) return;
  save(KEYS.settings, S);
  toast(added.length === 1 ? L('{name} added to {crew}', { name: added[0], crew: t.crew }) : L('{names} added to {crew}', { names: added.join(', '), crew: t.crew }));
}

// ---------- routing: #day/2026-10-03, #task/<uid>/<tab>, #clock/<day>, #report/<day>, #settings, #p=<link code> ----------

// The passcode guards the superintendent's parts: the daily report, settings, and making or changing
// assignments (any sheet this phone didn't receive). On the PM's phone the time clock is the crew
// timesheet, so it is guarded too. Crew sheets and everyone else's time clock are open.
// #live, #records/<people|sheets|reports> and #hub (the hub's status, open to a crew phone) are the hub screens of live.mjs.
const VIEWS = ['clock', 'report', 'settings', 'live', 'records', 'hub'];
const isPM = () => S.role === 'Project manager';
const crewPhone = () => S.role === 'Crew member'; // set on the first run: no office words on this phone unless Settings changes it
const needsOffice = vw => ['report', 'settings', 'live', 'records'].includes(vw.v) || (vw.v === 'clock' && isPM()) || (vw.v === 'task' && find(vw.uid)?.origin !== 'link');

function route() {
  if (setup) return; // the first run is still asking; it routes when it's done
  // The sign-in pad guards one address: a repeat event for it changes nothing, moving on (back button, a link) closes it.
  const pad = document.querySelector('dialog.pin[open]');
  if (pad) { if (pad.dataset.want === location.hash) return; pad.close(); }
  document.querySelectorAll('dialog.sheet[open]').forEach(x => x.dataset.at !== location.hash && x.close()); // a sheet left behind on the last screen would act on it
  fileIfChanged(current());
  fileReportIfChanged(S, day);
  const h = location.hash.slice(1);
  if (h.startsWith('p=')) return openCode(h.slice(2));
  const [v, a, b] = h.split('/');
  if (['day', 'clock', 'report'].includes(v) && /^\d{4}-\d{2}-\d{2}$/.test(a) && addDays(a, 0) === a) day = a; // a real day, not 2026-02-30
  view = v === 'task' && find(a) ? { v: 'task', uid: a, tab: b || 'assign' } : { v: VIEWS.includes(v) ? v : 'board', sub: a };
  if (view.v === 'task') day = find(a).date;
  if (needsOffice(view) && !office()) { // the crew board stays behind the passcode pad
    view = { v: 'board' };
    render();
    const want = location.hash; // unless the person has moved on: signed in, show it; closed, back to the crew board
    return passcode().then(ok => location.hash === want && (ok ? route() : location.replace('#day/' + day)));
  }
  render();
  scrollTo(0, 0);
}

async function openCode(code) {
  let data;
  try { data = await unpack(code); } catch { toast(L('That link is damaged or cut off. Ask for it to be sent again.'), 'bad'); return location.replace('#day/' + day); }
  if (data.kind === 'join') return openJoin(data);
  // A crew phone (or a new office phone) learns the office's code from its first link. A phone with
  // office-made sheets of its own never does, so no link can lock it out of its own records.
  if (['task', 'result', 'day', 'report'].includes(data.kind) && !T.some(x => x.origin === 'mine') && !hasReports()) adoptPin(S, data.pin);
  if (data.kind === 'hours' && !isPM()) { toast(L("Hours links are logged on the PM's phone.")); return location.replace('#clock/' + day); } // only the PM keeps and changes hours
  const forOffice = data.kind === 'hours' || data.kind === 'report' || data.kind === 'day' || (data.kind === 'result' && find(data.task?.uid)?.origin !== 'link');
  if (forOffice && !office()) {
    const want = location.hash;
    if (!await passcode()) return location.hash === want && location.replace('#day/' + day);
  }
  if (data.kind === 'report') { const d = await openReport(data, S); return location.replace(d ? '#report/' + d : '#day/' + day); }
  if (data.kind === 'day') return importDay(data);
  if (data.kind === 'hours') { const d = openHours(data, S); return location.replace('#clock/' + (d || day)); }
  const inc = normTask(data.task);
  let t = find(inc.uid), firstSheet = false;
  if (!inc.uid || !['task', 'result'].includes(data.kind)) { toast(L('That link has no task sheet in it'), 'bad'); return location.replace('#day/' + day); }
  // An older text opened after a newer one (a re-sent sheet on the crew phone, results on the office phone) changes nothing.
  const older = data.kind === 'task' ? t?.origin === 'link' && inc.sentAt && t.sentAt && inc.sentAt < t.sentAt
    : t && t.origin !== 'link' && t.resultAt && inc.resultAt < t.resultAt;
  if (older) { toast(L('This is an older copy of this sheet. The newer one is kept.')); return location.replace(`#task/${t.uid}/${data.kind === 'result' ? 'review' : 'assign'}`); }
  let moved = [];
  if (data.kind === 'task') {
    if (!t) {
      T.push(t = Object.assign(inc, { origin: 'link', gotAt: Date.now() })); // a crew phone opening its sheet
      firstSheet = !S.lang && !S.me && !T.some(x => x.origin === 'mine'); // a phone with a name in Settings is an office phone
    } else if (t.origin === 'link') mergeTask(t, inc, 'assign'); // re-sent sheet: new assignment, crew check-offs kept
    moved = renumberClashes(T, t, sync.onHub);
  } else if (!t || t.origin !== 'link') { // results reaching the superintendent (not the crew re-opening its own)
    if (!t) T.push(t = Object.assign(inc, { origin: 'mine' }));
    else mergeTask(t, inc, 'crew');
    t.gotAt = Date.now();
    moved = renumberClashes(T, t, sync.onHub);
    toast(L('{crew} results for {id} received', { crew: t.crew || L('Crew'), id: t.id }) + renumbered(moved));
  }
  if (moved.length && data.kind === 'task') toast(renumbered(moved).trim());
  if (data.kind === 'result' && t.origin !== 'link') fileTask(t);
  persist();
  location.replace(`#task/${t.uid}/${data.kind === 'result' ? 'review' : 'assign'}`);
  if (firstSheet) langSheet(); // first sheet on a new crew phone: ask the language once
}
// No language chosen yet, so both at once. Picking one closes it.
function langSheet() {
  const d = sheet(`<h3>Language · Idioma</h3><div class="btns"><button class="btn big" data-act="lang" data-v="en">English</button><button class="btn big primary" data-act="lang" data-v="es">Español</button></div>`);
  d.querySelector('.sheet-x').setAttribute('aria-label', 'Close · Cerrar');
  return d;
}

// A hub invite (kind join, made by the PM): the join sheet of live.mjs asks the name and crew and connects. A phone on
// another hub, or on this one with another key, is asked first; a new crew phone picks its language before the sheet opens.
async function openJoin(data) {
  location.replace('#day/' + day);
  const h = data.hub && typeof data.hub === 'object' ? data.hub : {};
  if (S.hubRole === 'pm' && S.hubUrl === h.url) return toast(L('This is the PM phone. Send the invite to the person it is for.')); // its key is shown only once, at setup
  if (S.hubUrl && S.hubKey && (S.hubUrl !== h.url || S.hubKey !== h.key)
    && !await ask(L('This phone is already connected to a hub. Use this invite instead?'), L('Use this invite'))) return;
  const open = () => joinSheet({ ...ctx(), sync: { ...sync, joinFrom: d => sync.joinFrom(d, { replace: true }) } }, data); // asked above
  if (data.role === 'crew' && !S.lang && !S.me && !T.some(x => x.origin === 'mine')) return langSheet().addEventListener('close', open);
  open();
}

async function importDay(data) {
  const date = /^\d{4}-\d{2}-\d{2}$/.test(data.date) ? data.date : day;
  const inc = (Array.isArray(data.tasks) ? data.tasks : []).slice(0, 500).map(normTask).filter(t => t.uid);
  const fresh = inc.filter(t => !find(t.uid)), known = inc.filter(t => find(t.uid));
  if (inc.length && await ask(L('Load the task plan for {date}? New sheets: {fresh}. Updated: {known}. Check-offs already on this phone are kept.', { date: niceDate(date), fresh: fresh.length, known: known.length }), L('Load plan'))) {
    for (const t of fresh) T.push(Object.assign(t, { origin: 'mine' }));
    for (const t of known) mergeTask(find(t.uid), t, 'assign');
    const moved = inc.flatMap(t => renumberClashes(T, find(t.uid), sync.onHub));
    persist();
    toast(L('Plan loaded') + renumbered(moved));
  }
  location.replace('#day/' + date);
}
// What renumberClashes changed, for the toast: ' Your sheet T1019-02 is now T1019-03 ...' ('' when nothing).
const renumbered = moved => moved.map(([t, old]) => ' ' + L('Your sheet {old} is now {id}: another sheet has that number.', { old, id: t.id })).join('');

// ---------- views ----------

// The tab bar: a crew phone (or any phone signed out) has Today and its time clock; signed in, the office screens.
// An office phone on a hub also has Live and Records (live.mjs).
const TAB_ICON = { day: 'today', clock: 'clock', report: 'report', live: 'live', records: 'records' };
function header() {
  const on = office(), lb = document.getElementById('langBtn'), lock = document.getElementById('lockBtn'), gear = document.getElementById('gearBtn'), tabs = document.getElementById('officeTabs');
  document.body.classList.toggle('office', on);
  lb.textContent = getLang() === 'es' ? 'EN' : 'ES';
  lb.setAttribute('aria-label', getLang() === 'es' ? 'English' : 'Español');
  lock.innerHTML = icon(on ? 'unlock' : 'lock');
  lock.setAttribute('aria-label', on ? L('Lock the office screens') : L('Office sign-in'));
  gear.hidden = !on;
  gear.innerHTML = icon('gear');
  gear.setAttribute('aria-label', L('Settings'));
  document.getElementById('proj').textContent = [S.project, S.site].filter(Boolean).join(' · ');
  tabs.setAttribute('aria-label', L('Screens'));
  const here = { clock: 'clock', report: 'report', live: 'live', records: 'records', settings: '', hub: '' }[view.v] ?? 'day';
  const list = on ? [['day', L('Tasks')], ['clock', isPM() ? L('Hours') : L('Time clock')], ['report', L('Report')], ...(hubOn() ? [['live', L('Live')], ['records', L('Records')]] : [])]
    : [['day', L('Today')], ['clock', L('Time clock')]];
  tabs.innerHTML = list.map(([v, label]) => {
    const locked = v === 'clock' && isPM() && !on; // the PM's time clock is the crew timesheet, behind the passcode
    return `<a href="#${v}${v === 'live' || v === 'records' ? '' : '/' + day}"${v === here ? ' aria-current="page"' : ''}${locked ? ` aria-label="${esc(`${label}, ${L('needs the office passcode')}`)}"` : ''}>${icon(TAB_ICON[v])}<span>${label}${locked ? icon('lock', 'lock') : ''}</span></a>`;
  }).join('');
  document.getElementById('hubDot').innerHTML = statusDot(sync.hubStatus(), getLang(), role() === 'crew' ? 'hub' : 'live'); // nothing without a hub
}

let drawnOn = today(); // the day the screen was last drawn, to notice midnight
let dups = null; // with a hub: sheets sharing a day and a short id (sync.mjs duplicateShortIds), for the "Same number" pill
function render() {
  drawnOn = today();
  dups = hubOn() ? sync.duplicateShortIds(T) : null;
  header();
  screenHead(''); // each screen sets its own title
  bar.hidden = ['settings', 'live', 'records', 'hub'].includes(view.v);
  bar.innerHTML = ''; // and puts its one primary action here
  const back = { go: `day/${day}`, label: L('Back to task sheets') };
  if (view.v === 'settings') { screenHead(L('Settings'), { back }); app.innerHTML = settingsView(S, hubSettingsView(ctx())); }
  else if (view.v === 'hub') { screenHead(L('Hub'), { back }); app.innerHTML = `<div class="settings">${hubSettingsView(ctx())}</div>`; } // a crew phone's way to the hub (the dot)
  else if (view.v === 'live') app.innerHTML = liveView(ctx());
  else if (view.v === 'records') app.innerHTML = recordsView(ctx(), view.sub);
  else if (view.v === 'clock' || view.v === 'report') renderOffice(view.v, S, day);
  else if (view.v === 'task') renderTask(current());
  else renderBoard();
}

function renderBoard() {
  const all = dayTasks();
  const list = all.filter(t => !crewFilter || t.crew === crewFilter)
    .sort((a, b) => floorRank(a.floor) - floorRank(b.floor) || a.floor.localeCompare(b.floor) || a.pStart.localeCompare(b.pStart));
  // Finished sheets wait in their own group for review; accepted ones fold away at the bottom, like Things' Logbook.
  const toReview = list.filter(t => t.origin !== 'link' && t.status && !t.review);
  const accepted = list.filter(t => t.review === 'Accepted');
  const active = list.filter(t => !toReview.includes(t) && !accepted.includes(t));
  const floors = [...new Set(active.map(t => t.floor))];
  const est = all.reduce((n, t) => n + t.est * (t.size || 1), 0);
  const act = all.reduce((n, t) => n + worked(t) / 60 * (t.size || 1), 0);
  const done = all.filter(t => !isOpen(t)).length, blocked = all.filter(t => t.status === 'Blocked').length;
  // The office can pick any crew (the + then starts a sheet for it); a crew phone only the crews it has sheets from.
  const crews = [...new Set([...(office() ? S.crews.map(c => c.name) : []), ...all.map(t => t.crew)].filter(Boolean))];
  const prev = prevDay();
  const rows = ts => `<div class="list lead">${ts.map(row).join('')}</div>`;
  const head = (text, n, cls = '') => `<h3 class="section-h${cls}">${text}<small>${n}</small></h3>`;
  screenHead(day === today() ? L('Today') : niceDate(day), { sub: day === today() ? '' : day < today() ? L('Past day') : L('Planning ahead'), more: 'boardMenu' });
  app.innerHTML = `<div class="board">${dateBar(day)}${all.length ? `
    ${office() ? `<div class="stats board-stats">
      <div class="stat"><b>${all.length}</b><span>${L('Task sheets')}</span></div>
      <div class="stat"><b>${done}</b><span>${L('Complete')}</span></div>
      <div class="stat"><b class="${blocked ? 'bad' : ''}">${blocked}</b><span>${L('Blocked')}</span></div>
      <div class="stat"><b>${hrs(act)}<small> / ${hrs(est)}</small></b><span>${L('Crew-hrs actual / est.')}</span></div>
    </div>` : ''}
    ${crews.length > 1 || crewFilter ? `<div class="chips scroll crew-filter" role="group" aria-label="${L('Show crew')}">
      <button class="chip" data-act="filter" data-v="" aria-pressed="${!crewFilter}">${L('All crews')}</button>
      ${crews.map(c => `<button class="chip" data-act="filter" data-v="${esc(c)}" aria-pressed="${crewFilter === c}" style="${crewVar(c)}"><i class="dot"></i>${esc(c)}</button>`).join('')}
    </div>` : ''}
    ${toReview.length ? head(L('Finished · ready for review'), toReview.length, ' review-h') + rows(toReview) : ''}
    ${floors.map(f => { const ts = active.filter(t => t.floor === f); return head(esc(f || L('Floor not set')), ts.length) + rows(ts); }).join('')}
    ${accepted.length ? `<details class="done-group logbook"><summary>${icon('check', 'logbook-ic')}<span>${L('Accepted')}</span><small>${accepted.length}</small>${icon('chev', 'chev')}</summary>${rows(accepted)}</details>` : ''}
    ${list.length ? '' : `<p class="hint board-none">${L('No sheets for this crew on this day.')}</p>`}
    ${office() ? '' : `<button class="btn wide open-link" data-act="paste">${L('Open a link')}</button>`}
    ${office() || crewPhone() ? '' : `<button class="link sign-in" data-act="lockBtn">${L('Office sign-in')}</button>`}`
    : !office()
      ? `<div class="empty">${icon('today', 'empty-ic')}<h2>${L('No task sheets for {date}', { date: niceDate(day) })}</h2>
        <p>${hubOn() ? L('Sheets for your crew show up here by themselves. A texted link still works too.') : L('Open the link your superintendent texted you, or paste it here.')}</p>
        <button class="btn primary" data-act="paste">${L('Open a link someone sent you')}</button>
        ${crewPhone() ? '' : `<button class="link" data-act="lockBtn">${L('Superintendent or PM? Sign in to the office screens')}</button>`}</div>`
      : `<div class="empty">${icon('today', 'empty-ic')}<h2>${L('No task sheets for {date}', { date: niceDate(day) })}</h2>
        <p>${L('Tap + to make one sheet for each crew, then send it to their phones.')}</p>
        ${prev ? `<button class="link" data-act="carryDay">${L('Copy unfinished from {date}', { date: niceDate(prev) })}</button>` : ''}</div>`}</div>`;
  bar.innerHTML = office() ? `<button class="fab" data-act="new" aria-label="${L('New task')}">${icon('plus')}</button>` : ''; // the + floats over the list
  if (crewFilter) app.querySelector('.crew-filter [aria-pressed=true]')?.scrollIntoView({ inline: 'nearest', block: 'nearest' }); // the chosen crew stays in sight
}

// One sheet on the board: a progress pie (a check once it is done), the area and number, then a quiet line with the
// crew, the time and the status word in its color. .tcard and .tid are what the browser checks read.
function row(t) {
  const [label, tone] = stage(t), n = t.items.length, d = doneCount(t);
  const lead = !isOpen(t) ? `<span class="pie full" role="img" aria-label="${esc(label)}">${icon('check')}</span>`
    : n ? `<span class="pie" style="--p:${(d / n).toFixed(3)}" role="img" aria-label="${esc(L('{d} of {n} steps done', { d, n }))}"></span>`
      : '<span class="pie none" aria-hidden="true"></span>';
  const when = t12(t.pStart);
  return `<a class="row tcard${!isOpen(t) ? ' is-done' : ''}" href="#task/${esc(t.uid)}/${t.status && !t.review ? 'review' : 'assign'}" style="${crewVar(t.crew, t.crewId)}">
    <span class="row-lead">${lead}</span>
    <span class="row-main"><span class="row-title">${t.area ? `<span class="area">${esc(t.area)}</span> ` : ''}<span class="tid">${esc(t.id || L('New task'))}</span></span>
      <span class="row-sub">${[`<span class="who"><i class="dot"></i> ${esc(t.crew || L('No crew yet'))}</span>`, when && `<span class="nw">${esc(when)}</span>`,
        `<span class="stage" data-tone="${tone}">${esc(label)}</span>`].filter(Boolean).join(' ·&nbsp;')}</span>
      ${same(t) ? `<span class="pill" data-tone="warn">${L('Same number as another sheet')}</span>` : ''}</span>
    ${t.est ? `<span class="row-end">${esc(L('{n} hrs', { n: t.est }))}</span>` : ''}${icon('chev', 'chev')}
  </a>`;
}

// Two sent sheets with the same date and number (made on two office phones offline): both say so until one is renumbered.
// With a hub, any two (a sheet that came only through the hub was never texted, so it has no sentAt).
const same = t => (dups ? dups.has(t.uid) : sameNumber(T, t));
const clash = (t, more = '') => (same(t) ? `<p class="hint"><span class="pill" data-tone="warn">${L('Same number as another sheet')}</span>${more}</p>` : '');

function renderTask(t) {
  const crewSide = t.origin === 'link';
  const tabs = [['assign', L('Assign')], ['results', L('Crew results')], ['review', L('Review')]];
  screenHead(t.area || (t.id ? L('Task {id}', { id: t.id }) : L('New task')), {
    sub: [t.floor, t.area && t.id && L('Task {id}', { id: t.id })].filter(Boolean).join(' · '), more: crewSide ? 'crewMenu' : 'taskMenu',
    back: { go: `day/${t.date}`, label: L('{date} task sheets', { date: niceDate(t.date) }) },
  });
  app.innerHTML = `<div class="tsheet">${crewSide
    ? banner(t, true) + clash(t) + brief(t) + results(t)
    : `<nav class="tabs" aria-label="${L('Task sheet')}">${tabs.map(([k, l]) => `<a href="#task/${esc(t.uid)}/${k}" data-act="tab" data-v="${k}"${k === view.tab ? ' aria-current="page"' : ''}>${l}</a>`).join('')}</nav>`
      + banner(t, false) + clash(t, ' ' + L('Change the Task ID on one of them.'))
      + (view.tab === 'results' ? brief(t) + results(t) : view.tab === 'review' ? review(t) : assign(t))}
    <p class="hint saved">${L('Changes save on this phone as you type.')}</p></div>`;
  bar.innerHTML = !crewSide && view.tab === 'review' ? '' : `<div class="bar-in">${crewSide
    ? `<button class="btn primary big" data-act="sendResults">${L('Send results')}</button>`
    : `<button class="btn primary big" data-act="sendTask">${t.sentAt ? L('Resend to crew') : L('Send to crew')}</button>`}</div>`;
}

// The calm note at the top of a sheet: on a crew phone, the office's message; on the office phone, where review stands.
// The office's words show in the reader's language on a hub (live.mjs txView; as typed without one).
function banner(t, crewSide) {
  const box = (tone, title, html, foot, more = '') => `<div class="banner" data-tone="${tone}" role="note"><b>${esc(title)}</b>${html ? `<p>${html}</p>` : ''}${foot ? `<small>${esc(foot)}</small>` : ''}${more}</div>`;
  const cx = ctx(), tx = text => text && txView(cx, text, t.aLang);
  const reviewed = () => (t.review ? box(t.review === 'Accepted' ? 'good' : 'warn', L(t.review), tx(t.followUp), t.reviewer && L('by {name}', { name: t.reviewer })) : '');
  if (crewSide) return (t.reply ? box('info', L('Message from the office'), tx(t.reply), [t.replyBy, t.replyAt && stamp(t.replyAt)].filter(Boolean).join(' · ')) : '') + reviewed(); // the review reaches a crew phone through the hub
  if (t.review) return reviewed();
  if (t.status && view.tab !== 'review') return box('info', L('Finished · ready for review'), '', [L(t.status), t.gotAt && stamp(t.gotAt)].filter(Boolean).join(' · '),
    `<button class="link" data-act="tab" data-v="review">${L('Review')}${icon('chev')}</button>`);
  return '';
}

const crewHrsLine = t => L('Crew of {size}: {allot} crew-hrs allotted, {est} estimated.', { size: t.size || 1, allot: hrs(t.allot * (t.size || 1)), est: hrs(t.est * (t.size || 1)) })
  + (t.pStart && t.pStop ? ' ' + L('Planned window {time}.', { time: fmtMin(span(t.pStart, t.pStop)) }) : '');

const addRow = (id, ph, a) => `<div class="edit-row"><input id="${id}" aria-label="${esc(ph)}" placeholder="${esc(ph)}" enterkeyhint="done" data-enter="${a}"><button class="x add" data-act="${a}" aria-label="${esc(ph)}">+</button></div>`;

// The member on the sheet that is this person: by id when both have one, else by name.
const memberAt = (t, pid, name) => t.members.findIndex((m, i) => (pid && t.memberIds[i] ? t.memberIds[i] === pid : nameKey(m) === nameKey(name)));

// The office's form: grouped inset lists (label left, box right; stacked on a narrow phone), a small heading over each.
const group = (title, body) => `<h3 class="caption group-caption">${title}</h3><section class="card form">${body}</section>`;

function assign(t) {
  // One chip a person: the crew's people, then anyone else on the sheet.
  const chips = people(S).filter(p => (t.crewId ? p.crewId === t.crewId : p.crew === t.crew)).map(p => ({ id: p.id, name: p.name }));
  t.members.forEach((name, i) => { if (memberAt({ members: chips.map(c => c.name), memberIds: chips.map(c => c.id) }, t.memberIds[i], name) < 0) chips.push({ id: t.memberIds[i], name }); });
  const on = p => memberAt(t, p.id, p.name) >= 0;
  const checks = [...new Set([...S.checks, ...t.checks.map(c => c.text)])];
  return group(L('Assignment'), `
      ${field(L('Date'), 't.date', t.date, { type: 'date' })}${field(L('Assigned by'), 't.by', t.by)}
      ${field(L('Floor / level'), 't.floor', t.floor, { list: 'floors' })}${field(L('Task ID'), 't.id', t.id)}
      ${field(L('Room / area'), 't.area', t.area, { list: 'areas', wide: true, ph: L('e.g. Elec room 3E, east corridor') })}
      ${datalist('floors', S.floors)}${datalist('areas', T.map(x => x.area))}`)
  + group(L('Crew'), `
    <div class="field wide"><span>${L('Crew')}</span><div class="chips">${S.crews.map(c => `<button class="chip" data-act="crew" data-v="${esc(c.id)}" aria-pressed="${t.crewId ? t.crewId === c.id : t.crew === c.name}" style="${crewVar(c.name, c.id)}"><i class="dot"></i>${esc(c.name)}</button>`).join('')}</div></div>
    <div class="field wide"><span>${L('Crew members on this task')}</span>
      ${chips.length ? `<div class="chips">${chips.map(p => `<button class="chip" data-act="member" data-v="${esc(p.name)}" data-pid="${esc(p.id)}" aria-pressed="${on(p)}">${esc(p.name)}</button>`).join('')}</div>` : ''}
      ${addRow('newMember', L('Add a name'), 'addMember')}</div>
    ${field(L('Crew lead'), 't.lead', t.lead)}${field(L('Crew size'), 't.size', t.size, { type: 'number', mode: 'numeric' })}`)
  + group(L('Assigned task & required finish'), `
    ${field(L('Work, quantities and limits of scope'), 't.scope', t.scope, { rows: 4, ph: L('e.g. Pull and terminate 12 AWG for lighting circuits L3-14 to L3-18, east corridor. Stop at grid line 7.') })}
    ${field(L('Drawing / detail references'), 't.refs', t.refs, { wide: true, ph: L('e.g. E-301, detail 4/E-502') })}
    <div class="field wide"><span>${L('Steps the crew checks off')}</span><div class="checklist steps-edit">
      ${t.items.map((it, i) => `<div class="edit-row"><input data-k="t.items.${i}.text" value="${esc(it.text)}" aria-label="${esc(L('Step {n}', { n: i + 1 }))}"><button class="x" data-act="delItem" data-i="${i}" aria-label="${esc(L('Remove step {n}', { n: i + 1 }))}">✕</button></div>`).join('')}
      ${addRow('newItem', L('Add a step'), 'addItem')}</div></div>
    <div class="field wide"><span>${L('Required finish / accuracy checks')}</span>
      <div class="chips">${checks.map(p => `<button class="chip" data-act="check" data-v="${esc(p)}" aria-pressed="${t.checks.some(c => c.text === p)}">${esc(p)}</button>`).join('')}</div>
      ${addRow('newCheck', L('Add another check'), 'addCheck')}</div>`)
  + group(L('Assigned work time & estimate'), `
      ${field(L('Allotted time (hrs)'), 't.allot', t.allot, { type: 'number', mode: 'decimal' })}
      ${field(L('Your estimate (hrs)'), 't.est', t.est, { type: 'number', mode: 'decimal' })}
      ${field(L('Allotted notes'), 't.allotNote', t.allotNote)}${field(L('Estimate notes'), 't.estNote', t.estNote)}
      ${field(L('Planned start'), 't.pStart', t.pStart, { type: 'time' })}${field(L('Planned stop'), 't.pStop', t.pStop, { type: 'time' })}${field(L('Check-in at'), 't.checkIn', t.checkIn, { type: 'time' })}
    <p class="hint out form-foot" data-out="crewHrs">${crewHrsLine(t)}</p>`);
}

// What the crew reads first: who it's for and where it stands, the scope in plain words, then the details.
function brief(t) {
  const [label, tone] = stage(t), c = ctx(), tx = (text, lang) => txView(c, text, lang); // as typed with no hub
  const row = (k, html) => (html ? `<dt>${esc(k)}</dt><dd>${html}</dd>` : ''); // html: already escaped
  const note = n => (n ? ' · ' + esc(n) : '');
  return `<section class="brief" style="${crewVar(t.crew, t.crewId)}">
    <div class="brief-top"><span class="who"><i class="dot"></i> ${esc(t.crew || L('Crew'))}</span><span class="pill" data-tone="${tone}">${esc(label)}</span></div>
    ${t.scope ? `<p class="scope-text">${tx(t.scope, t.aLang)}</p>` : ''}
    <dl class="kv info">${row(L('Drawings'), tx(t.refs, t.aLang))}${row(L('Planned'), t.pStart && esc(fromTo(t.pStart, t.pStop)))}${row(L('Check in at'), esc(t12(t.checkIn)))}
      ${row(L('Allotted'), t.allot && esc(L('{n} hrs', { n: t.allot })) + note(t.allotNote))}${row(L('Estimate'), t.est && esc(L('{n} hrs', { n: t.est })) + note(t.estNote))}
      ${row(L('Crew'), t.members.map(m => esc(m) + (nameKey(m) && nameKey(m) === nameKey(S.worker) ? ` (${esc(L('you'))})` : '')).join(', '))}${row(L('Assigned'), esc(niceDate(t.date) + (t.by ? ' · ' + L('by {name}', { name: t.by }) : '')))}</dl></section>`;
}

function workedLine(t) {
  if (!t.aStart) return L('Tap Start when the crew begins.');
  if (!t.aStop) return L('Started {time}. Tap Stop when the crew wraps up.', { time: t12(t.aStart) });
  const w = worked(t);
  return L('{on} on task', { on: fmtMin(span(t.aStart, t.aStop)) }) + (t.delay ? ' ' + L('minus {m}m delays', { m: t.delay }) : '')
    + ` = ${L('{w} worked', { w: fmtMin(w) })} · ${L('{n} crew-hrs', { n: hrs(w / 60 * (t.size || 1)) })}`
    + (t.est ? ` · ${L('{sign}{n} hrs vs estimate', { sign: w / 60 > t.est ? '+' : '', n: hrs(w / 60 - t.est) })}` : '');
}

// The crew's part: big round checkboxes, one Time & status card (Start and Stop, the status), then the notes.
function results(t) {
  const d = doneCount(t), n = t.items.length, c = t.checks.filter(x => x.done).length, cx = ctx();
  // a step's words in the reader's language; no tap to the original inside the tick button (that tap ticks)
  const tick = (list, it, i) => `<button class="tick" data-act="tick" data-list="${list}" data-i="${i}" aria-pressed="${it.done}"><span class="box">✓</span><span class="txt">${txView(cx, it.text, t.aLang, getLang(), { toggle: false })}</span>${it.at ? `<small>${timeOf(it.at)}</small>` : ''}</button>`;
  // Start and Stop: a big button until tapped, then the time it took, which can be fixed by hand.
  const clock = (k, label, now, primary) => `<div class="clockslot"><span>${label}</span>${t[k]
    ? `<input type="time" data-k="t.${k}" value="${esc(t[k])}" aria-label="${label}">`
    : `<button class="btn big${primary ? ' primary' : ''}" data-act="clock" data-v="${k}">${now}</button>`}</div>`;
  return `${n ? `<section class="steps"><h3 class="section-h">${L('Check off as you go')}<small>${L('{d} of {n} done', { d, n })}</small></h3>
      <div class="checklist">${t.items.map((it, i) => tick('items', it, i)).join('')}</div></section>` : ''}
    ${t.checks.length ? `<section class="steps"><h3 class="section-h">${L('Required finish checks')}<small>${L('{d} of {n} done', { d: c, n: t.checks.length })}</small></h3>
      <div class="checklist">${t.checks.map((it, i) => tick('checks', it, i)).join('')}</div></section>` : ''}
  <section class="card timecard"><h2>${L('Time & status')}</h2>
    <div class="startstop">${clock('aStart', L('Actual start'), icon('play') + L('Start now'), true)}${clock('aStop', L('Actual stop'), icon('stop') + L('Stop now'), !!t.aStart)}</div>
    <p class="out" data-out="worked">${workedLine(t)}</p>
    <div class="field"><span>${L('Delay / interruption (minutes)')}</span><div class="edit-row stepper">
      <button class="x" data-act="delay" data-v="-15" aria-label="${L('15 minutes less')}">−</button>
      <input type="number" inputmode="numeric" min="0" step="any" data-k="t.delay" value="${t.delay || ''}" placeholder="0" aria-label="${L('Delay minutes')}">
      <button class="x" data-act="delay" data-v="15" aria-label="${L('15 minutes more')}">+</button></div></div>
    <div class="field"><span>${L('Status')}</span>${seg('t.status', t.status, [['Complete', 'good', L('Complete')], ['Partial', 'warn', L('Partial')], ['Blocked', 'bad', L('Blocked')]])}</div>
  </section>
  <section class="card notes"><h2>${L('Notes')}</h2>
    ${txField(cx, L('Work / quantity completed (locations and details)'), 't.doneText', t.doneText, { rows: 3 }, t.cLang)}
    ${txField(cx, L('Work remaining'), 't.remain', t.remain, { rows: 2 }, t.cLang)}
    ${txField(cx, L('Crew comments / concerns'), 't.comments', t.comments, { rows: 3, ph: L('What helped or slowed the work? Quality, rework, support needed') }, t.cLang)}
    ${field(L('Crew / lead'), 't.lead', t.lead)}
  </section>`;
}

function review(t) {
  const [label, tone] = stage(t), w = worked(t), cx = ctx(), tx = text => txView(cx, text, t.cLang); // the crew's words in the reader's language
  const row = (k, html, cls = '') => (html ? `<dt${cls}>${esc(k)}</dt><dd${cls}>${html}</dd>` : ''), long = ' class="long"'; // long: typed text, stacked
  return `<section class="brief" style="${crewVar(t.crew, t.crewId)}"><div class="brief-top"><span class="who"><i class="dot"></i> ${esc(t.crew || L('Crew'))}</span><span class="pill" data-tone="${tone}">${esc(label)}</span></div>
    ${t.status || t.aStart ? `<dl class="kv info">${row(L('Status'), esc(t.status ? L(t.status) : L('In progress')))}${row(L('Steps'), t.items.length && esc(L('{d} of {n} done', { d: doneCount(t), n: t.items.length })))}
      ${row(L('Checks'), t.checks.length && esc(L('{d} of {n} done', { d: t.checks.filter(c => c.done).length, n: t.checks.length })))}
      ${row(L('Worked'), w && esc(`${fmtMin(w)} · ${L('{n} crew-hrs', { n: hrs(w / 60 * (t.size || 1)) })}`))}${row(L('Estimate'), t.est && esc(`${L('{n} hrs', { n: t.est })} · ${L('{n} crew-hrs', { n: hrs(t.est * (t.size || 1)) })}`))}
      ${row(L('Delays'), t.delay && esc(L('{n} min', { n: t.delay })))}${row(L('Completed'), t.doneText && tx(t.doneText), long)}${row(L('Remaining'), t.remain && tx(t.remain), long)}${row(L('Crew notes'), t.comments && tx(t.comments), long)}
      ${row(L('Received'), esc(stamp(t.gotAt)))}</dl>`
    : `<p class="hint">${L("No results from the crew yet. They'll show here when the crew sends them, or fill them in yourself on the Crew results tab.")}</p>`}</section>`
  + group(L('Lead / superintendent review'), `
    <div class="field wide">${seg('t.review', t.review, [['Accepted', 'good', L('Accepted')], ['Follow-up needed', 'warn', L('Follow-up needed')]])}</div>
    ${field(L('Reviewed by'), 't.reviewer', t.reviewer)}
    ${field(L('Follow-up / next step'), 't.followUp', t.followUp, { rows: 3 })}
    <div class="form-foot"><button class="btn wide" data-act="carry">${L('Carry open work to {date}', { date: niceDate(addDays(t.date, 1)) })}</button></div>`);
}

const OUT = { crewHrs: crewHrsLine, worked: workedLine };

// ---------- PDF: always an English form; notes appear exactly as typed ----------

function recordRows(t) {
  const box = i => `${i.done ? '[x]' : '[ ]'} ${i.text}`;
  return [
    [`Task ${t.id} · ${t.floor} · ${t.crew}`, [['Date', niceDate(t.date, 'en')], ['Assigned by', t.by], ['Room / area', t.area], ['Crew members', t.members.join(', ')], ['Crew size', t.size], ['Crew / lead', t.lead]]],
    ['1 Assigned task & required finish', [['Scope', t.scope], ['Drawings', t.refs], ['Steps', t.items.map(box).join('\n')], ['Finish checks', t.checks.map(box).join('\n')]]],
    ['2 Assigned work time & estimate', [['Allotted', t.allot && `${t.allot} hrs ${t.allotNote}`], ['Estimate', t.est && `${t.est} hrs ${t.estNote}`],
      ['Planned', t.pStart && `${t12(t.pStart)} to ${t12(t.pStop)}`], ['Check-in at', t12(t.checkIn)]]],
    ['3 Actual time & progress', [['Actual start', t12(t.aStart)], ['Actual stop', t12(t.aStop)], ['Delay', t.delay && `${t.delay} min`],
      ['Time worked', worked(t) && fmtMin(worked(t), 'en')], ['Status', t.status], ['Completed', t.doneText], ['Remaining', t.remain]]],
    ['4 Crew comments / concerns', [['Comments', t.comments]]],
    ['5 Review', [['Result', t.review], ['Reviewed by', t.reviewer], ['Follow-up', t.followUp]]],
  ];
}

const record = t => makePdf('Electrical task sheet', letterhead(S), recordRows(t), `${COMPANIES} · Task ${t.id}`);
const fileName = t => `${t.id} ${t.crew} ${t.floor}`.trim();
function fileTask(t) {
  if (!S.folderUrl) return;
  t.filedAt = Date.now();
  persist();
  return fileAway(S, { date: t.date, name: fileName(t), bytes: record(t), v: t.updatedAt });
}
// A finished sheet edited after it was filed (say, a follow-up note typed after tapping the review
// button) is filed again when you leave it, so the folder always has the last word.
const fileIfChanged = t => t && (t.status || t.review) && t.updatedAt > t.filedAt && fileTask(t);

// ---------- office passcode pad: big keys for gloved hands; a keyboard's number keys work too ----------

// Resolves true once signed in (or the code is changed), false if closed.
function passcode(mode = hasPin(S) ? 'enter' : 'create') {
  return new Promise(done => {
    let first = '', code = '', busy = false, checked = mode !== 'change'; // changing the code takes the current one first
    const d = sheet(`<h3>${{ enter: L('Office sign-in'), create: L('Create the office passcode'), change: L('Change the passcode') }[mode]}</h3>
      <p class="pin-msg" role="status"></p>
      <div class="pin-dots" aria-hidden="true">${'<i></i>'.repeat(4)}</div><span class="sr" aria-live="polite"></span>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-pin="${n}">${n}</button>`).join('')}
        <span></span><button type="button" data-pin="0">0</button><button type="button" data-pin="back" aria-label="${L('Delete a digit')}">${icon('del')}</button></div>`);
    d.classList.add('pin');
    d.dataset.want = location.hash;
    const msg = d.querySelector('.pin-msg'), dots = d.querySelector('.pin-dots');
    const say = (text, bad = false) => { msg.textContent = text; msg.classList.toggle('bad', bad); };
    const draw = () => {
      dots.querySelectorAll('i').forEach((el, i) => el.classList.toggle('on', i < code.length));
      d.querySelector('.sr').textContent = L('{n} of 4 digits', { n: code.length });
    };
    const ask4 = () => say(!checked ? L('Enter the current passcode.') : mode === 'enter' ? L('Enter the 4-digit passcode.') : first ? L('Enter it again to confirm.')
      : L("Pick 4 digits. Use the same code on the PM's and the superintendent's phones."));
    const fail = text => { code = ''; draw(); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); say(text, true); navigator.vibrate?.(60); };
    async function full() {
      if (!checked) {
        const r = await tryPin(S, code);
        if (r !== 'ok') return fail(r === 'wait' ? L('Too many wrong codes. Try again in a minute.') : L('Wrong passcode. Try again.'));
        checked = true; code = ''; draw(); return ask4();
      }
      if (mode !== 'enter' && !first) { first = code; code = ''; draw(); return ask4(); }
      if (mode !== 'enter' && code !== first) { first = ''; return fail(L("The codes didn't match. Start again.")); }
      const result = mode === 'enter' ? await tryPin(S, code) : setPin(S, await pinHash(code)) && signIn() ? 'ok' : 'unsaved';
      if (result === 'ok') {
        if (mode !== 'enter') toast(mode === 'change' ? L('Passcode changed') : L('Office screens unlocked'));
        done(true);
        return d.close();
      }
      fail(result === 'wait' ? L('Too many wrong codes. Try again in a minute.') : result === 'wrong' ? L('Wrong passcode. Try again.') : L("This phone wouldn't save. Open Settings and download a backup."));
    }
    const press = async k => {
      if (busy) return;
      code = k === 'back' ? code.slice(0, -1) : (code + k).slice(0, 4);
      draw();
      if (code.length < 4) return;
      busy = true;
      try { await full(); } catch { fail(L('The passcode needs the secure https:// address of this app.')); } finally { busy = false; } // no crypto.subtle off https
    };
    d.addEventListener('click', e => { const b = e.target.closest('[data-pin]'); if (b) press(b.dataset.pin); });
    d.addEventListener('keydown', e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('back'); });
    d.addEventListener('close', () => done(false));
    ask4();
  });
}

// ---------- first run: a new phone asks one question per screen, once ----------

// A new phone: nothing saved yet. A phone with settings (a role, a name), sheets, reports or hours never sees it.
const isNewPhone = () => [KEYS.settings, KEYS.tasks, KEYS.reports, KEYS.hours, KEYS.crewHours, KEYS.pin].every(k => load(k, null) == null);
let setup = false; // the first run is up: nothing routes behind it

// Language, then who is using this phone, then their name; office roles then create or enter the passcode. Nothing is
// saved until the last answer, so a phone that reloads half way starts over, and it can't be skipped except by answering.
async function firstRun() {
  setup = true;
  const crew = 'Crew member', a = { lang: '', role: '', name: '' };
  let step = 'lang', msg = '';
  // Opened from a texted link: its names to pick from, and the office code it carries (kept in memory until the end).
  // A hub invite answers who uses this phone itself: after the language, its join sheet asks the rest (openJoin).
  let linked = [], invite = null;
  const readLink = async () => {
    if (!location.hash.startsWith('#p=')) return;
    try {
      const data = await unpack(location.hash.slice(3));
      if (data.kind === 'join') invite = data;
      linked = [data.task, ...(Array.isArray(data.tasks) ? data.tasks : [])].filter(Boolean).flatMap(x => normTask(x).members);
      if (['task', 'result', 'day', 'report'].includes(data.kind) && !hasPin(S) && PIN_FORMAT.test(data.pin)) S.pin = data.pin;
    } catch {} // a damaged link says so once the phone is set up
  };
  const names = () => [...new Map([...people(S).map(p => p.name), ...(a.role === crew ? linked : [])].filter(n => nameKey(n)).map(n => [nameKey(n), n])).values()];
  const d = document.createElement('dialog');
  d.className = 'firstrun';
  d.setAttribute('aria-labelledby', 'frQ');
  d.addEventListener('cancel', e => e.preventDefault()); // Escape doesn't skip it
  const brand = `<div class="fr-brand">${document.querySelector('.top .mark').outerHTML}<div><b>${COMPANY}</b><span>${COMPANY_ALT}</span></div></div>`;
  const back = to => `<button class="link fr-back" data-fr="back" data-v="${to}">${icon('back')}<span>${L('Back')}</span></button>`;
  const dots = () => { const n = a.role && a.role !== crew ? 4 : 3, at = ['lang', 'role', 'name', 'pin'].indexOf(step); return `<div class="fr-dots" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i${i <= at ? ' class="on"' : ''}></i>`).join('')}</div>`; };
  const option = (fr, v, title, sub = '') => `<button class="fr-opt" data-fr="${fr}" data-v="${esc(v)}"><span><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>${icon('chev', 'chev')}</button>`;
  const screens = {
    lang: () => `<h2 class="large-title" id="frQ" tabindex="-1">Language · Idioma</h2>
      <div class="fr-opts">${option('lang', 'en', 'English')}${option('lang', 'es', 'Español')}</div>`,
    role: () => `${back('lang')}<h2 class="large-title" id="frQ" tabindex="-1">${L('Who is using this phone?')}</h2>
      <div class="fr-opts">${option('role', crew, L('Crew member'), L('Task sheets and the time clock'))}
        ${option('role', 'Superintendent', L('Superintendent'), L("Builds the day's task sheets and the daily report"))}
        ${option('role', 'Project manager', L('Project manager'), L('Reports and crew hours'))}</div>`,
    name: () => `${back('role')}<h2 class="large-title" id="frQ" tabindex="-1">${L('What is your name?')}</h2>
      <p class="secondary">${a.role === crew ? L('It goes on your time clock and your task sheets.') : L('It goes on the sheets you assign and sign off.')}</p>
      ${names().length ? `<div class="chips fr-names">${names().map(n => `<button class="chip" data-fr="pick" data-v="${esc(n)}" aria-pressed="${nameKey(n) === nameKey(a.name)}">${esc(n)}</button>`).join('')}</div>` : ''}
      <label class="field"><span>${names().length ? L('Or type it') : L('Your name')}</span><input id="frName" value="${esc(a.name)}" autocomplete="name" autocapitalize="words" enterkeyhint="done" maxlength="60"></label>
      <p class="fr-msg" role="alert">${esc(msg)}</p>
      <button class="btn primary big wide" data-fr="next">${a.role === crew ? L('Done') : L('Next')}</button>`,
    pin: () => `<h2 class="large-title" id="frQ" tabindex="-1">${L('Office passcode')}</h2>`, // the pad over it says what to do
  };
  const draw = focus => {
    d.innerHTML = `<div class="fr-in">${brand}${dots()}<div class="fr-step">${screens[step]()}</div></div>`;
    (focus && d.querySelector(focus) || d.querySelector('#frQ')).focus?.({ preventScroll: true });
  };
  return new Promise(done => {
    const finish = () => {
      S.lang = a.lang;
      S.role = a.role;
      const name = cleanName(a.name), match = findPerson(S, name);
      if (a.role === crew) { S.worker = names().find(n => nameKey(n) === nameKey(name)) || name; S.workerId = match?.id || ''; }
      if (a.role === 'Superintendent') { S.worker = match?.name || name; S.workerId = match?.id || ''; } // their own time clock, without asking again
      S.me = a.role === crew ? '' : name; // a name typed for an office role, then backed out of, doesn't stay
      save(KEYS.settings, S) || toast(L("This phone wouldn't save. Open Settings and download a backup."), 'bad');
      if (hasPin(S)) save(KEYS.pin, S.pin);
      setup = false;
      d.close();
      d.remove();
      done();
    };
    const next = async () => {
      a.name = d.querySelector('#frName').value;
      if (!nameKey(a.name)) { msg = L('Type your name first'); draw('#frName'); return; }
      msg = '';
      if (a.role === crew) return finish();
      Object.assign(S, { lang: a.lang, role: a.role, me: cleanName(a.name) }); // so a passcode saved now carries them
      step = 'pin';
      draw();
      if (await passcode()) return finish();
      step = 'name';
      draw('#frName');
    };
    d.addEventListener('click', async e => {
      const b = e.target.closest('[data-fr]');
      if (!b) return;
      const v = b.dataset.v;
      switch (b.dataset.fr) {
        case 'lang':
          a.lang = v; setLang(v); await readLink();
          if (invite) { a.role = invite.role === 'crew' ? crew : 'Superintendent'; return finish(); }
          step = 'role'; return draw();
        case 'role': a.role = v; step = 'name'; return draw('#frName');
        case 'back': step = v; msg = ''; return draw();
        case 'pick': d.querySelector('#frName').value = v; return next(); // one tap on a known name answers
        case 'next': return next();
      }
    });
    d.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'frName') { e.preventDefault(); next(); } });
    document.body.append(d);
    d.showModal();
    draw();
  });
}

// ---------- actions ----------

function menu(items) {
  sheet(`<h3>${L('More')}</h3><div class="menu">${items.filter(Boolean).map(([a, label, cls]) => `<button class="btn ${cls || ''}" data-act="${a}">${esc(label)}</button>`).join('')}</div>`);
}

function resultMsg(t, l) {
  const x = (en, v) => L(en, v, l), w = worked(t);
  return x('{crew} results for task {id} ({floor}): {status}. {d} of {n} steps done.', { crew: t.crew, id: t.id, floor: t.floor, status: x(t.status), d: doneCount(t), n: t.items.length })
    + (w ? ' ' + x('Worked {time}.', { time: fmtMin(w, l) }) : '')
    + (t.status === 'Blocked' && t.comments ? ' ' + t.comments.slice(0, 140) : '');
}
function taskMsg(t, l) {
  const x = (en, v) => L(en, v, l);
  const where = [t.floor, t.area].filter(Boolean).join(', ');
  const when = [niceDate(t.date, l), t.pStart && x('{start} to {stop}', { start: t12(t.pStart), stop: t12(t.pStop) })].filter(Boolean).join(', ');
  return x('{crew}: task {id}, {where}, {when}. Open it, check off steps as you go, then tap "Send results".', { crew: t.crew, id: t.id, where, when });
}

async function send(kind, t) {
  if (kind === 'task') { t.sentAt = Date.now(); persist(); render(); }
  const payload = kind === 'day' ? { v: 1, kind, pin: S.pin, date: day, tasks: dayTasks() } : { v: 1, kind, pin: S.pin, task: t };
  const url = linkTo('tasks.html', await pack(payload));
  if (kind === 'task') {
    // A crew that has answered in Spanish before gets the message in both languages.
    const both = getLang() === 'es' || T.some(x => x.crew === t.crew && x.cLang === 'es');
    sendSheet({ title: L('Task {id} for {crew}', { id: t.id, crew: t.crew }), url, text: both ? `${taskMsg(t, 'en')}\n\n${taskMsg(t, 'es')}` : taskMsg(t, 'en') });
  } else if (kind === 'result') {
    // A Spanish-mode crew sees its own language first; the superintendent gets the English line.
    sendSheet({ title: L('Results for task {id}', { id: t.id }), url, text: t.cLang === 'es' ? `${resultMsg(t, 'es')}\n\n${resultMsg(t, 'en')}` : resultMsg(t, 'en') });
  } else {
    const ts = dayTasks();
    sendSheet({ title: L('Task plan for {date}', { date: niceDate(day) }), url,
      text: L('Task plan for {date}: {n} sheets ({crews}). Open to load it on your phone.', { date: niceDate(day), n: ts.length, crews: [...new Set(ts.map(x => x.crew).filter(Boolean))].join(', ') }) });
  }
}

async function act(a, el) {
  const t = current(), v = el.dataset.v;
  switch (a) {
    case 'new': {
      const nt = normTask({ uid: uid(), origin: 'mine', id: nextId(T, day), date: day, by: S.me, updatedAt: Date.now() });
      if (crewFilter) pickCrew(nt, S.crews.find(c => c.name === crewFilter));
      T.push(nt);
      persist();
      return go(`task/${nt.uid}/assign`);
    }
    case 'toggleLang': return act('lang', { dataset: { v: getLang() === 'es' ? 'en' : 'es' } });
    case 'lockBtn':
      if (office()) { signOut(); toast(L('Office screens locked')); return needsOffice(view) ? go('day/' + day) : render(); } // a worker's time clock stays open
      return (await passcode()) && go('day/' + day);
    case 'changePin': return passcode('change');
    case 'lang':
      S.lang = v;
      save(KEYS.settings, S);
      setLang(v);
      if (!document.querySelector('#toast .toast-undo')) document.getElementById('toast')?.classList.remove('show');
      return render();
    case 'filter': crewFilter = v; break;
    case 'tab': history.replaceState(null, '', `#task/${t.uid}/${v}`); view.tab = v; render(); return scrollTo(0, 0);
    case 'set': {
      const ctx = { t, s: S };
      setPath(ctx, el.dataset.k, getPath(ctx, el.dataset.k) === v ? '' : v);
      if (el.dataset.k === 't.review' && t.review && !t.reviewer) t.reviewer = S.me;
      if (el.dataset.k === 't.status' && t.status === 'Blocked' && !t.comments) toast(L('Say what is blocking the work in Crew comments'));
      if (el.dataset.k === 't.review' && t.review) { t.updatedAt = Date.now(); persist(); render(); return fileTask(t); } // stamp the edit, then file
      break;
    }
    case 'crew': pickCrew(t, crewById(S, v)); break;
    case 'member': {
      const i = memberAt(t, el.dataset.pid, v);
      if (i >= 0) { t.members.splice(i, 1); t.memberIds.splice(i, 1); } else { t.members.push(v); t.memberIds.push(el.dataset.pid || ''); }
      t.size = t.members.length;
      break;
    }
    case 'addMember': case 'addItem': case 'addCheck': {
      const input = document.getElementById({ addMember: 'newMember', addItem: 'newItem', addCheck: 'newCheck' }[a]);
      const text = input.value.trim();
      if (!text) return input.focus();
      if (a === 'addMember') {
        const p = findPerson(S, text, t.crewId), name = p?.name || cleanName(text); // the roster's spelling, else as the roster will save it
        if (nameKey(name) && memberAt(t, p?.id, name) < 0) { t.members.push(name); t.memberIds.push(p?.id || ''); } // ',,,' adds nobody
        t.size = t.members.length;
        enlist(t);
      }
      if (a === 'addItem') t.items.push(newItem(text));
      if (a === 'addCheck' && !t.checks.some(c => c.text === text)) t.checks.push(newItem(text));
      if (a !== 'addMember') t.aLang = getLang(); // a step or a check typed in this phone's language
      t.updatedAt = Date.now();
      persist();
      render();
      return document.getElementById(input.id).focus(); // keep the keyboard up for the next entry
    }
    case 'delItem': { // gone at once; Undo puts the same step back in its place for 6 seconds
      const i = +el.dataset.i, [gone] = t.items.splice(i, 1);
      if (!gone) return;
      t.updatedAt = Date.now();
      persist();
      render();
      return toast(L('Step removed'), '', { undo: () => {
        const s = find(t.uid); // the list may have been reloaded from storage since
        if (!s || s.items.some(x => x.id === gone.id)) return;
        s.items.splice(Math.min(i, s.items.length), 0, gone);
        s.updatedAt = Date.now();
        persist();
        render();
      } });
    }
    case 'check': t.checks = t.checks.some(c => c.text === v) ? t.checks.filter(c => c.text !== v) : [...t.checks, newItem(v)]; break;
    case 'tick': {
      const it = t[el.dataset.list][+el.dataset.i];
      it.done = !it.done;
      it.at = it.done ? Date.now() : 0;
      navigator.vibrate?.(12);
      if (it.done && [...t.items, ...t.checks].every(i => i.done) && !t.status) toast(L('Everything is checked off. Set the status and send results.'));
      break;
    }
    case 'clock': t[v] = nowHM(); break;
    case 'delay': t.delay = Math.max(0, t.delay + +v); break;
    case 'sendTask':
      if (!t.crew || !(t.scope || t.items.length)) return toast(L('Pick a crew and describe the work first'), 'bad');
      return send('task', t);
    case 'sendResults': {
      if (!t.status) {
        const s = app.querySelector('.timecard .seg');
        s?.scrollIntoView({ block: 'center' });
        s?.querySelector('button')?.focus({ preventScroll: true });
        s?.classList.remove('need'); void s?.offsetWidth; s?.classList.add('need'); // a short shake draws the eye (off with reduced motion)
        return toast(L('Pick Complete, Partial or Blocked first'), 'bad');
      }
      t.cLang = getLang();
      t.resultAt = Date.now(); // the office phone keeps these over an older results text
      persist();
      await send('result', t);
      return fileTask(t);
    }
    case 'sendDay': return send('day');
    case 'boardMenu': {
      const prev = prevDay();
      return menu(office()
        ? [dayTasks().length && ['sendDay', L('Send day plan')], prev && ['carryDay', L('Copy unfinished work from {date}', { date: niceDate(prev) })], ['paste', L('Open a link someone sent you')],
          dayTasks().length && ['pdfDay', L("Save this day's sheets as one PDF")], ['settings', L('Settings, crews and backup')]]
        : [['paste', L('Open a link someone sent you')], dayTasks().length && ['pdfDay', L("Save this day's sheets as one PDF")], !crewPhone() && ['lockBtn', L('Office sign-in')]]);
    }
    case 'taskMenu':
      return menu([['dup', L('Duplicate for another crew or floor')], ['carry', L('Carry open work to {date}', { date: niceDate(addDays(t.date, 1)) })],
        ['pdfTask', L('Save this sheet as PDF')], S.folderUrl && ['fileNow', L('Save to the review folder now')], ['del', L('Delete this task sheet'), 'danger']]);
    case 'crewMenu': return menu([['pdfTask', L('Save this sheet as PDF')], ['paste', L('Open a link someone sent you')], ['del', L('Delete this task sheet'), 'danger']]);
    case 'carryDay': {
      const prev = prevDay();
      const open = T.filter(x => x.date === prev && isOpen(x) && !T.some(y => y.from === x.uid));
      if (!open.length) return toast(L('Nothing left open from {date}', { date: niceDate(prev) }));
      for (const x of open) {
        const c = cloneTask(x, day, true);
        Object.assign(c, { from: x.uid, id: nextId(T, day), by: S.me || x.by, scope: x.remain ? `${x.remain}\n\n${L('Carried over from {id}: {scope}', { id: x.id, scope: x.scope })}` : x.scope });
        T.push(c);
      }
      toast(L('Unfinished sheets copied: {n}', { n: open.length }));
      break;
    }
    case 'carry': case 'dup': {
      const date = a === 'carry' ? addDays(t.date, 1) : t.date;
      const c = cloneTask(t, date, a === 'carry');
      Object.assign(c, { id: nextId(T, date), from: a === 'carry' ? t.uid : '', scope: a === 'carry' && t.remain ? `${t.remain}\n\n${L('Carried over from {id}: {scope}', { id: t.id, scope: t.scope })}` : t.scope });
      T.push(c);
      persist();
      toast(a === 'carry' ? L('Carried to {date}', { date: niceDate(date) }) : L('Duplicated. Change the crew or floor.'));
      return go(`task/${c.uid}/assign`);
    }
    case 'del': { // gone at once, with Undo for 6 seconds instead of an "are you sure?"; the PM's phone on a hub then takes it off the hub too
      if (role() === 'pm' && hubOn()) return deleteRecord(ctx(), 'task', t.uid);
      return toast(L('Task {id} deleted', { id: t.id || L('New task') }), '', { undo: remove('task', t.uid) });
    }
    case 'pdfTask': return savePdf(`${fileName(t)}.pdf`, record(t));
    case 'pdfDay': return savePdf(`Task sheets ${day}.pdf`, makePdf(`Electrical task sheets · ${niceDate(day, 'en')}`, letterhead(S), dayTasks().flatMap(recordRows), `${COMPANIES} · ${niceDate(day, 'en')}`));
    case 'fileNow': return fileTask(t);
    case 'paste': return pasteSheet(code => go('p=' + code));
    case 'settings': return go('settings');
    case 'addCrew': case 'delCrew': case 'backup': case 'testFolder': case 'pEdit': case 'pDel': await settingsAct(a, S, el, f => { f(S); save(KEYS.settings, S); render(); }); break; // f: a removal's Undo, on the settings as they are by then
    case 'pAdd': { // keep the keyboard up in that crew's box for the next name
      const crew = el.dataset.crew;
      await settingsAct(a, S, el);
      render();
      return document.querySelector(`input[data-enter=pAdd][data-crew="${CSS.escape(crew)}"]`)?.focus();
    }
  }
  if (t) t.updatedAt = Date.now();
  persist();
  render();
}

document.addEventListener('click', e => {
  if (e.target.matches('[data-pick]') && matchMedia('(pointer: fine)').matches) try { e.target.showPicker(); } catch {} // desktop: open the calendar anywhere on the date
  const el = e.target.closest('[data-act],[data-go]');
  if (!el) return;
  e.preventDefault();
  el.closest('dialog')?.close();
  if (stale()) return;
  if (drawLater && (app.contains(el) || bar.contains(el))) return void drawSoon(); // drawn before a pull reloaded what it shows: redraw, the person taps again
  if (el.dataset.go) return go(el.dataset.go);
  const a = el.dataset.act;
  // A second tap on an action still running (sending, sharing, saving) does nothing; then the redrawn control plays its animation.
  busy(el, () => (liveOwns(a) ? liveAct(ctx(), a, el) // the hub screens' own taps
    : (view.v === 'clock' || view.v === 'report') && !SHELL.has(a) ? reportAct(a, el, S, day, view.v) : act(a, el)))
    .then(() => twin(el)?.classList.add('just'));
});
// The control as drawn again after a tap (a checkbox, a segment), found by its data attributes.
const twin = el => (el.isConnected ? el : app.querySelector(['act', 'v', 'i', 'list', 'k'].filter(k => el.dataset[k] != null).map(k => `[data-${k}="${CSS.escape(el.dataset[k])}"]`).join('')));
const SHELL = new Set(['toggleLang', 'lang', 'lockBtn']); // header buttons work on every screen

// The sign-in ran out (or another tab locked) while this screen was up: office screens and the office board
// go back behind the passcode before anything is saved; a worker's time clock and crew sheets stay and carry on.
function stale() {
  if (document.body.classList.contains('office') === office()) return false;
  if (needsOffice(view) || view.v === 'board') { route(); return true; }
  header();
  return false;
}

document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.k;
  if (!k) { if (el.dataset.lv && !stale()) liveInput(ctx(), el); return; } // the Records search box
  if (stale()) return;
  const t = current();
  // A pull deleted the sheet being typed in, or may have moved a list this field points into by position: redraw, write nothing.
  if ((!t && k.startsWith('t.')) || (drawLater && /\.\d+\./.test(k))) { drawLater = false; return render(); }
  if (k.startsWith('r.')) { reportInput(el, S, day); return liveInput(ctx(), el); } // and its translated preview, if it has one
  if (k.startsWith('h.')) return hoursInput(el, S, day);
  if (k === 't.date' && !/^\d{4}-\d{2}-\d{2}$/.test(el.value)) return; // every sheet needs a real day; a cleared or half-typed date would hide it
  setPath({ t, s: S }, k, readInput(el));
  if (k.startsWith('s.')) {
    save(KEYS.settings, S);
    if (k === 's.lang' || k === 's.role') { setLang(S.lang); render(); }
    return;
  }
  // The language each part is typed in, so the hub can translate it for a reader of the other language.
  if (/^t\.(scope|refs|area|allotNote|estNote|followUp|items\.\d+\.text)$/.test(k)) t.aLang = getLang();
  if (/^t\.(doneText|remain|comments)$/.test(k)) t.cLang = getLang();
  t.updatedAt = Date.now();
  persist();
  for (const o of app.querySelectorAll('[data-out]')) o.textContent = OUT[o.dataset.out](t);
  liveInput(ctx(), el); // a translated preview under the field asks again
});

document.addEventListener('change', e => {
  if (stale()) return;
  if (e.target.matches('[data-pick]') && e.target.value) go(`${e.target.dataset.pick || 'day'}/${e.target.value}`);
  if (e.target.matches('[data-restore]') && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; busy(e.target.closest('label'), () => restore(f)); } // cleared, so the same file can be picked again after a Cancel
  if (e.target.dataset.k === 't.date' && /^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) day = e.target.value; // moved to another day
  if (e.target.dataset.k === 's.worker') workerChange(S);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.enter) {
    e.preventDefault();
    const a = e.target.dataset.enter;
    if (!stale()) liveOwns(a) ? liveAct(ctx(), a, e.target) : act(a, e.target);
  }
});

// The other app (or another tab, or the hub sync) changed shared data: reload so a stale copy here never overwrites it.
function reloadData() {
  Object.assign(S, loadSettings()); setLang(S.lang); T = loadTasks(); reloadReports(); attachShifts(S);
  if (view.v === 'task' && !current()) view = { v: 'board' };
}
const reload = () => {
  reloadData();
  if (document.body.classList.contains('office') && !office()) document.querySelectorAll('dialog[open]:not(.pin)').forEach(d => d.close()); // signed out elsewhere: an office question left open can't finish
  if (hubOn()) return drawSoon(); // another tab's background sync saves too: the redraw waits for the field being typed in
  needsOffice(view) && !office() ? route() : render();
};

// ---------- the hub (HUB.md; sync.mjs keeps the stores in step, live.mjs draws the hub screens) ----------

// What live.mjs is handed on every call; its header comment lists each piece.
function ctx() {
  const r = role();
  return { S, tasks: () => T, shifts: () => (r === 'pm' ? crewNow() : []), reports: reportsNow, role: r, day, sync, go, render: drawSoon, toast, now: Date.now, saveTask, remove };
}
// Message and Review on the hub screens: the sheet with office fields changed, each changed part stamped past its last stamp.
function saveTask(n) {
  const i = T.findIndex(x => x.uid === n.uid), old = T[i];
  if (!old) return;
  const moved = ks => ks.some(k => JSON.stringify(n[k]) !== JSON.stringify(old[k]));
  if (moved(sync.A_KEYS)) n.assignAt = Math.max(n.assignAt, old.assignAt + 1);
  if (moved(sync.C_KEYS)) n.crewAt = Math.max(n.crewAt, old.crewAt + 1);
  T[i] = n;
  persist();
  fileIfChanged(n); // a review is filed, as the Review tab files it
}
// A delete (the sheet's menu, live.mjs deleteRecord): gone from this phone at once. Returns what puts it back where it
// was, for the Undo; null if this phone had no such record.
function remove(kind, key) {
  if (kind === 'report') return dropReport(key);
  const at = T.findIndex(x => x.uid === key), t = T[at];
  if (!t) return null;
  T.splice(at, 1);
  persist();
  if (view.v === 'task' && view.uid === key) { view = { v: 'board' }; go('day/' + t.date); } // a sheet gone from under its own screen
  return () => {
    if (find(key)) return; // back already (another tab's Undo, or the hub)
    T.splice(Math.min(at, T.length), 0, t);
    persist();
    render();
  };
}
// The sync saved what it pulled: every in-memory copy reloads now, before any further tap. The screen redraws too, but
// never under a field someone is typing in: then it waits until the field is left, and until the tap that left it lands.
let drawLater = false;
const typing = () => !!document.activeElement?.matches?.('textarea, select, input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=file])') && app.contains(document.activeElement);
function drawSoon() {
  if (typing()) return void (drawLater = true);
  drawLater = false;
  needsOffice(view) && !office() ? route() : render();
}
document.addEventListener('focusout', () => { if (drawLater) setTimeout(() => drawLater && drawSoon(), 300); });
const SYNCED = new Set([KEYS.tasks, KEYS.reports, KEYS.hours, KEYS.crewHours, KEYS.settings]);
// A status change redraws the header dot, and the two screens that are about the hub; Settings redraws after its own taps.
sync.initHub({ S, toast, onChange: () => { reloadData(); drawSoon(); }, onStatus: () => { if (!stale()) header(); if (view.v === 'live' || view.v === 'hub') drawSoon(); } }); // stale(): a sign-in that ran out goes behind the passcode
onSave(k => SYNCED.has(k) && sync.poke()); // after every save; the sync's own timer and wake-ups catch anything else
setTextField((label, k, v, o, lang) => txField(ctx(), label, k, v, o, lang)); // the daily report's typed text
new MutationObserver(() => liveAfter(ctx(), app)).observe(app, { childList: true }); // after every draw: translate the typed text on screen
addEventListener('storage', e => [...Object.values(KEYS), UNLOCK].includes(e.key) && reload());
addEventListener('pageshow', e => e.persisted && reload());
addEventListener('hashchange', route);
addEventListener('online', () => retryUploads(S));
addEventListener('visibilitychange', () => {
  if (document.hidden) { fileIfChanged(current()); fileReportIfChanged(S, day); }
  else if (stale()) return;
  else if (drawnOn !== today() && day === drawnOn && ['board', 'clock', 'report'].includes(view.v)) go(`${view.v === 'board' ? 'day' : view.v}/${today()}`); // left open overnight: today's screen
  else if (view.v === 'clock' && !(isPM() && office())) render(); // a worker's clock may have passed its cutoff while hidden
});
addEventListener('pagehide', () => { fileIfChanged(current()); fileReportIfChanged(S, day); }); // queued even if the upload can't finish; retried on next open
app.addEventListener('toggle', sectionToggle, true);
if (isNewPhone()) firstRun().then(route); else route();
retryUploads(S);
</script>
</body>
</html>
